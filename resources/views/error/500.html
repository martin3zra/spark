<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.status}} — {{.title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --card: #ffffff;
        --border: #e5e5e5;
        --fg: #171717;
        --muted: #737373;
        --mono-bg: #f5f5f5;
        --accent: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #141414;
          --border: #262626;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --mono-bg: #1c1c1c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 42rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2rem;
      }
      .status {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border-radius: 999px;
        padding: 0.2rem 0.6rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p.hint {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      pre {
        margin: 0;
        padding: 1rem;
        background: var(--mono-bg);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 20rem;
        overflow: auto;
      }
      a {
        color: inherit;
      }
      .home {
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: none;
      }
      .home:hover {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="status">{{.status}}</span>
      <h1>{{.title}}</h1>
      <p class="hint">
        Shown because APP_ENV isn't "prod"/"production" — production renders
        the app's own Error/Index page instead of this raw message.
      </p>
      <pre>{{.message}}</pre>
      <a class="home" href="/">← Back home</a>
    </div>
  </body>
</html>
